# ====================================================================
# Transdata NMS - Nginx Production Virtual Host Configuration
# Place in: /etc/nginx/sites-available/transdata-nms
# Link to:  /etc/nginx/sites-enabled/transdata-nms
# ====================================================================

server {
    listen 80;
    server_name nms.transdata.net.id; # Ganti dengan domain atau IP server Anda

    # Redirect seluruh HTTP ke HTTPS di server produksi
    # return 301 https://$host$request_uri;

    root /var/www/transdata-nms/dist; # Direktori build statis React
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Frontend Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend PHP 8.3 REST API routing
    location /api/ {
        alias /var/www/transdata-nms/backend/public/;
        try_files $uri $uri/ /backend/public/index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock; # atau php8.2-fpm.sock
            fastcgi_param SCRIPT_FILENAME /var/www/transdata-nms/backend/public/index.php;
            include fastcgi_params;
            fastcgi_read_timeout 60s;
        }
    }

    # Larang akses file sensitif dan konfigurasi
    location ~ /\.(ht|git|env) {
        deny all;
    }

    location ~ ^/(backend/config|database|backend/src) {
        deny all;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
